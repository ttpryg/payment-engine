name: payment-engine
services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: payment-engine-php:8.1
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

networks:
  app-network:
